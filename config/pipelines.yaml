# Pipeline parameters. Alchemy Free caps eth_getLogs at 10 blocks.
data_dir: ./data
checkpoint_dir: ./data/checkpoints
duckdb_path: ./warehouse/dex.duckdb
chunk_size: 10
# 1000 ≈ interview-sized live sample on Alchemy free (chunk_size 10). Raise for denser history.
lookback_blocks: 1000
confirmations: 12
rpc_timeout_seconds: 30
rpc_max_retries: 5
rpc_backoff_seconds: 1.5
# Dust: human amount below this for BOTH sides, OR quote (USDC) below dust_usdc.
dust_token_threshold: 0.000001
dust_usdc_threshold: 1.0
