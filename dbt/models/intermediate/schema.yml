version: 2

models:
  - name: int_dex_trades
    description: Canonical dex.trades — one row per Swap log with noise flags.
    columns:
      - name: chain
        tests: [not_null]
      - name: protocol
        tests:
          - accepted_values:
              arguments:
                values:
                  - uniswap_v2
                  - uniswap_v3
                  - camelot_v3
                  - aerodrome_slipstream
                  - pharaoh_v3
      - name: tx_hash
        tests: [not_null]
      - name: log_index
        tests: [not_null]
      - name: is_clean
        tests: [not_null]
      - name: is_orderflow_interesting
        tests: [not_null]
      - name: is_potential_sandwich_leg
        tests: [not_null]
