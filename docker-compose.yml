services:
  pipeline:
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./warehouse:/app/warehouse
      - ./artifacts:/app/artifacts
    command:
      - sh
      - -c
      - >-
        uv run python -m dex_trades.run
        && uv run python -m dex_trades.build_warehouse
        && DEX_DUCKDB_PATH=warehouse/dex.duckdb
        uv run dbt build --project-dir dbt --profiles-dir dbt
        && uv run python -m dex_trades.evals

  test:
    build: .
    volumes:
      - ./artifacts:/app/artifacts
    command:
      - sh
      - -c
      - uv run pytest && uv run python -m dex_trades.evals --fixture-only
